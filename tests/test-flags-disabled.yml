name: Test action with follow and dispatch_ci disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          token: "fake-token-for-flags-test"
          follow: "false"
          dispatch_ci: "false"
          timeout: "5"

      - name: Assert action ran with flags disabled
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # With follow=false and dispatch_ci=false the action should still
          # attempt to run deploybot react (without --follow or --dispatch-ci).
          # The fake token will cause an API error, not an install/flag error.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with follow=false dispatch_ci=false (outcome=$OUTCOME)"
