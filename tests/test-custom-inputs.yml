name: Test custom inputs (no follow, no dispatch-ci, short timeout)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a valid mergequeue config at custom path
        run: |
          mkdir -p .config
          cat > .config/mergequeue.toml <<'EOF'
          [queue]
          base_branch = "main"
          queue_label = "merge-queue"
          blocked_label = "merge-queue-blocked"
          merge_method = "squash"
          required_checks = ["CI", "Lint"]
          dependency_directive = "Merge-queue-depends-on"
          trusted_actors = ["test-bot-actor"]
          coordinator_actors = ["test-bot-actor"]

          [files]
          generated_paths = []
          generated_version_paths = []
          asset_version_pattern = '\?v=[0-9a-f]{12}'

          [review]

          [pipeline]
          intent_label = "deploy-requested"
          pause_label = "deploybot-paused"
          registry_label = "deploybot-registry"
          registry_title = "DeployBot delivery registry"
          thread_active_hours = 72
          ci_workflows = ["CI"]
          deploy_workflows = ["Deploy"]
          batch_settle_seconds = 0
          ci_failure_grace_seconds = 0
          promotion_workers = 1
          ready_to_merge_target_minutes = 15
          merge_to_live_target_minutes = 10
          auto_promote = false
          intent_scope = "head"
          pause_on_failure = false

          [integration]
          mode = "manual"
          branch_prefix = "deploybot/integration"
          title_prefix = "DeployBot integration"
          EOF

      - name: Run DeployBot with custom config path and no follow/dispatch-ci
        id: action
        uses: .
        with:
          config: .config/mergequeue.toml
          follow: "false"
          dispatch_ci: "false"
          timeout: "30"
        continue-on-error: true

      - name: Assert action ran (success or known API failure)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With follow=false and dispatch_ci=false, the action should run
          # deploybot react --timeout 30 (no --follow, no --dispatch-ci flags).
          # It may succeed (no PRs) or fail with a GitHub API error.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with custom inputs (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
