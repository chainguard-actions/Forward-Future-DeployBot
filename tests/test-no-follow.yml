name: Test no-follow and no-dispatch-ci flags
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Copy fixture config to workspace root
        run: |
          cp "$GITHUB_WORKSPACE/tests/fixtures/.mergequeue.toml" "$GITHUB_WORKSPACE/.mergequeue.toml"

      - id: action
        uses: .
        with:
          config: .mergequeue.toml
          follow: "false"
          dispatch_ci: "false"
          timeout: "30"
        continue-on-error: true

      - name: Assert deploybot package is installed
        run: |
          if pip show deploybot-merge-queue > /dev/null 2>&1; then
            echo "PASS: deploybot-merge-queue package is installed (via pip)"
          elif pip3 show deploybot-merge-queue > /dev/null 2>&1; then
            echo "PASS: deploybot-merge-queue package is installed (via pip3)"
          elif python3 -m pip show deploybot-merge-queue > /dev/null 2>&1; then
            echo "PASS: deploybot-merge-queue package is installed (via python3 -m pip)"
          else
            echo "FAIL: deploybot-merge-queue package not found"
            exit 1
          fi

      - name: Verify react subcommand has expected flags
        run: |
          # Find deploybot binary
          DEPLOYBOT_BIN=""
          if command -v deploybot > /dev/null 2>&1; then
            DEPLOYBOT_BIN="$(command -v deploybot)"
          else
            DEPLOYBOT_BIN=$(find /usr /home /opt /root -name "deploybot" -type f 2>/dev/null | head -1)
          fi

          if [ -z "$DEPLOYBOT_BIN" ]; then
            echo "FAIL: deploybot not found"
            exit 1
          fi
          echo "Using deploybot at: $DEPLOYBOT_BIN"

          HELP_OUTPUT=$("$DEPLOYBOT_BIN" react --help 2>&1 || true)
          echo "react --help output:"
          echo "$HELP_OUTPUT"

          if echo "$HELP_OUTPUT" | grep -q "timeout"; then
            echo "PASS: --timeout flag is present in react subcommand"
          else
            echo "FAIL: --timeout flag not found in react help"
            exit 1
          fi

          if echo "$HELP_OUTPUT" | grep -qE "follow|dispatch"; then
            echo "PASS: --follow or --dispatch-ci flag is present in react subcommand"
          else
            echo "FAIL: expected flags not found in react help"
            exit 1
          fi
