name: Test basic usage with defaults
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run DeployBot action (expect failure due to no real GitHub context)
        id: action
        uses: .
        with:
          config: .mergequeue.toml
          follow: "true"
          dispatch_ci: "true"
          timeout: "30"
        continue-on-error: true
      - name: Assert action was attempted (python and deploybot installed)
        run: |
          # Verify Python is available after the action ran setup-python
          python --version
          echo "Python is available: PASS"
          # Verify deploybot was installed
          if ! command -v deploybot &>/dev/null; then
            echo "FAIL: deploybot command not found after action ran"
            exit 1
          fi
          echo "deploybot is installed: PASS"
      - name: Assert action outcome
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action may fail due to no real GitHub token/context, but it should
          # at least reach the deploybot execution step (not fail at install)
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "Action was attempted (outcome=$OUTCOME): PASS"
