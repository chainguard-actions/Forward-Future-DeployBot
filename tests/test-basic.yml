name: Test basic usage - default inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create minimal mergequeue config
        run: |
          cat > .mergequeue.toml <<'EOF'
          # minimal deploybot config
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          config: .mergequeue.toml
          follow: "true"
          dispatch_ci: "true"
          timeout: "30"

      - name: Assert deploybot CLI was installed
        run: |
          if ! command -v deploybot &>/dev/null; then
            echo "FAIL: deploybot CLI not found after action ran"
            exit 1
          fi
          echo "PASS: deploybot CLI is available"

      - name: Assert deploybot --help works
        run: |
          deploybot --help
          echo "PASS: deploybot --help exited successfully"
