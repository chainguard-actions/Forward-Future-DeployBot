name: Test default config path (missing config fails gracefully)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Use a non-existent config path to verify the action handles missing
      # config gracefully (fails with a config error, not a crash)
      - id: action
        uses: .
        continue-on-error: true
        with:
          mode: react
          config: .mergequeue-does-not-exist.toml
          follow: "false"
          dispatch_ci: "false"
          timeout: "30"

      - name: Assert action failed (missing config or sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected (missing config or sentinel repo)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded unexpectedly (acceptable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
