name: Test custom config path - action uses specified config file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a config file at a custom path
      - name: Create config at custom path
        run: |
          mkdir -p .config
          cat > .config/mergequeue.toml << 'EOF'
          [queue]
          base_branch = "main"
          queue_label = "merge-queue"
          blocked_label = "merge-queue-blocked"
          merge_method = "squash"
          required_checks = ["CI", "Lint"]
          dependency_directive = "Merge-queue-depends-on"
          trusted_actors = ["@repository-owner"]
          coordinator_actors = ["@repository-owner", "github-actions[bot]"]

          [files]
          generated_paths = []
          generated_version_paths = []
          asset_version_pattern = '\?v=[0-9a-f]{12}'

          [pipeline]
          intent_label = "deploy-requested"
          pause_label = "deploybot-paused"
          registry_label = "deploybot-registry"
          registry_title = "DeployBot delivery registry"
          thread_active_hours = 72
          ci_workflows = ["CI"]
          deploy_workflows = ["Deploy"]
          repair_hold_minutes = 60
          hold_merges_while_releasing = true
          repair_branch_prefix = "deploybot/repair"
          ready_to_merge_target_minutes = 15
          merge_to_live_target_minutes = 10
          auto_promote = true
          intent_scope = "head"
          pause_on_failure = true

          [integration]
          mode = "manual"
          branch_prefix = "deploybot/integration"
          title_prefix = "DeployBot integration"
          max_batch_size = 3
          require_non_actions_author = false
          EOF

      # Run the action with a custom config path
      - id: action
        uses: .
        with:
          config: .config/mergequeue.toml
          follow: "false"
          dispatch_ci: "false"
          timeout: "5"
        continue-on-error: true

      # Verify the package is installed (action ran its setup steps)
      - name: Assert deploybot package is installed
        run: |
          if ! python -m pip show deploybot-merge-queue > /dev/null 2>&1; then
            echo "FAIL: deploybot-merge-queue package is not installed"
            exit 1
          fi
          echo "PASS: deploybot-merge-queue package is installed"
          python -m pip show deploybot-merge-queue

      # Verify the custom config file exists and is readable
      - name: Assert custom config file is accessible
        run: |
          if [ ! -f ".config/mergequeue.toml" ]; then
            echo "FAIL: custom config file not found at .config/mergequeue.toml"
            exit 1
          fi
          echo "PASS: custom config file exists"
          # Verify it contains the expected merge method
          if ! grep -q 'merge_method = "squash"' .config/mergequeue.toml; then
            echo "FAIL: config file does not contain expected merge_method"
            exit 1
          fi
          echo "PASS: config file contains expected content"
