name: Test custom config path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a valid mergequeue config at custom path
        run: |
          mkdir -p .config
          cat > .config/mergequeue.toml << 'EOF'
          [queue]
          base_branch = "main"
          queue_label = "merge-queue"
          blocked_label = "merge-queue-blocked"
          merge_method = "squash"
          required_checks = ["CI"]
          dependency_directive = "Merge-queue-depends-on"
          trusted_actors = ["@repository-owner"]
          coordinator_actors = ["@repository-owner", "github-actions[bot]"]

          [files]
          generated_paths = []
          generated_version_paths = []
          asset_version_pattern = '\?v=[0-9a-f]{12}'

          [review]

          [pipeline]
          intent_label = "deploy-requested"
          pause_label = "deploybot-paused"
          registry_label = "deploybot-registry"
          registry_title = "DeployBot delivery registry"
          thread_active_hours = 72
          ci_workflows = ["CI"]
          deploy_workflows = ["Deploy"]
          batch_settle_seconds = 15
          ci_failure_grace_seconds = 90
          promotion_workers = 4
          repair_hold_minutes = 60
          hold_merges_while_releasing = true
          repair_branch_prefix = "deploybot/repair"
          ready_to_merge_target_minutes = 15
          merge_to_live_target_minutes = 10
          auto_promote = true
          intent_scope = "head"
          pause_on_failure = true

          [integration]
          mode = "manual"
          branch_prefix = "deploybot/integration"
          title_prefix = "DeployBot integration"
          max_batch_size = 3
          require_non_actions_author = false
          EOF
          echo "Custom config file created at .config/mergequeue.toml"
          # Ensure the default config does NOT exist so we can confirm custom path is used
          rm -f .mergequeue.toml
      - id: action
        uses: .
        continue-on-error: true
        with:
          config: .config/mergequeue.toml
          follow: "false"
          dispatch_ci: "false"
          timeout: "30"
      - name: Assert action did not fail due to config error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action may succeed or fail due to API/network issues,
          # but it should NOT fail due to a missing/invalid config at the custom path.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with custom config path, outcome=$OUTCOME"
      - name: Verify wrong config path causes failure
        run: |
          # Verify that using a non-existent config path would cause a failure
          # by checking that the custom config file exists (proving it was used)
          if [ ! -f ".config/mergequeue.toml" ]; then
            echo "FAIL: custom config file not found"
            exit 1
          fi
          echo "PASS: custom config file exists at .config/mergequeue.toml"
