name: Test custom config path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up custom config at non-default path
        run: |
          mkdir -p "$GITHUB_WORKSPACE/custom-config"
          cp "$GITHUB_WORKSPACE/tests/fixtures/.mergequeue.toml" "$GITHUB_WORKSPACE/custom-config/queue.toml"
          echo "Custom config written to custom-config/queue.toml"
          cat "$GITHUB_WORKSPACE/custom-config/queue.toml"

      - id: action
        uses: .
        with:
          config: custom-config/queue.toml
          follow: "false"
          dispatch_ci: "false"
          timeout: "30"
        continue-on-error: true

      - name: Assert deploybot package is installed
        run: |
          if pip show deploybot-merge-queue > /dev/null 2>&1; then
            echo "PASS: deploybot-merge-queue package is installed (via pip)"
          elif pip3 show deploybot-merge-queue > /dev/null 2>&1; then
            echo "PASS: deploybot-merge-queue package is installed (via pip3)"
          elif python3 -m pip show deploybot-merge-queue > /dev/null 2>&1; then
            echo "PASS: deploybot-merge-queue package is installed (via python3 -m pip)"
          else
            echo "FAIL: deploybot-merge-queue package not found"
            exit 1
          fi

      - name: Assert custom config file is valid TOML with expected content
        run: |
          # Write the Python check script to a file first to avoid YAML quoting issues
          printf '%s\n' \
            'import tomllib, sys' \
            'with open("custom-config/queue.toml", "rb") as f:' \
            '    data = tomllib.load(f)' \
            'branch = data.get("queue", {}).get("base_branch", "")' \
            'if not branch:' \
            '    print("FAIL: base_branch not found in config")' \
            '    sys.exit(1)' \
            'print("PASS: config is valid TOML, base_branch=" + branch)' \
            > /tmp/check_toml.py
          python3 /tmp/check_toml.py
