name: Test DeployBot custom config path
on:
  workflow_dispatch:
jobs:
  test-custom-config:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create custom config file
        run: |
          cat > /tmp/custom-mergequeue.toml << 'EOF'
          [queue]
          base_branch = "main"
          queue_label = "merge-queue"
          blocked_label = "merge-queue-blocked"
          merge_method = "merge"
          required_checks = ["CI"]
          dependency_directive = "Merge-queue-depends-on"
          trusted_actors = ["@test-owner"]
          coordinator_actors = ["@test-owner", "github-actions[bot]"]

          [files]
          generated_paths = []
          generated_version_paths = []
          asset_version_pattern = '\?v=[0-9a-f]{12}'

          [pipeline]
          intent_label = "deploy-requested"
          pause_label = "deploybot-paused"
          registry_label = "deploybot-registry"
          registry_title = "DeployBot delivery registry"
          thread_active_hours = 72
          ci_workflows = ["CI"]
          deploy_workflows = ["Deploy"]
          repair_hold_minutes = 60
          hold_merges_while_releasing = true
          repair_branch_prefix = "deploybot/repair"
          ready_to_merge_target_minutes = 15
          merge_to_live_target_minutes = 10
          auto_promote = true
          intent_scope = "head"
          pause_on_failure = true

          [integration]
          mode = "manual"
          branch_prefix = "deploybot/integration"
          title_prefix = "DeployBot integration"
          max_batch_size = 3
          require_non_actions_author = false
          EOF
          echo "Custom config created at /tmp/custom-mergequeue.toml"

      - id: action
        uses: .
        continue-on-error: true
        with:
          config: /tmp/custom-mergequeue.toml
          token: "dummy-token-for-config-test"
          follow: "false"
          dispatch_ci: "false"
          timeout: "5"

      - name: Assert deploybot CLI was installed
        run: |
          echo "Checking if deploybot CLI is available in PATH..."
          if ! command -v deploybot &>/dev/null; then
            echo "FAIL: deploybot CLI not found in PATH after action ran"
            exit 1
          fi
          echo "PASS: deploybot CLI is installed"

      - name: Assert deploybot can parse the custom config
        run: |
          echo "Verifying deploybot can load the custom config..."
          # Run deploybot with the custom config in a way that tests config parsing
          # deploybot doctor reads the config without needing GitHub API
          OUTPUT=$(deploybot --config /tmp/custom-mergequeue.toml doctor 2>&1 || true)
          echo "deploybot doctor output: $OUTPUT"
          # The config should be parseable (no TOML parse errors)
          if echo "$OUTPUT" | grep -qi "toml\|parse error\|invalid"; then
            echo "FAIL: config parsing error detected"
            exit 1
          fi
          echo "PASS: custom config was accepted without parse errors"
