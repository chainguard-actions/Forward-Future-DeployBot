name: Test deploybot installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create minimal mergequeue config
        run: |
          cat > "$GITHUB_WORKSPACE/.mergequeue.toml" <<'EOF'
          [queue]
          base_branch = "main"
          queue_label = "merge-queue"
          blocked_label = "merge-queue-blocked"
          merge_method = "merge"
          required_checks = ["CI"]
          dependency_directive = "Merge-queue-depends-on"
          trusted_actors = ["@repository-owner"]
          coordinator_actors = ["@repository-owner", "github-actions[bot]"]

          [files]
          generated_paths = []
          generated_version_paths = []
          asset_version_pattern = '\?v=[0-9a-f]{12}'

          [review]

          [pipeline]
          intent_label = "deploy-requested"
          pause_label = "deploybot-paused"
          registry_label = "deploybot-registry"
          registry_title = "DeployBot delivery registry"
          thread_active_hours = 72
          ci_workflows = ["CI"]
          deploy_workflows = ["Deploy"]
          repair_hold_minutes = 60
          ready_to_merge_target_minutes = 15
          merge_to_live_target_minutes = 10
          auto_promote = true
          intent_scope = "head"
          pause_on_failure = true

          [integration]
          mode = "manual"
          branch_prefix = "deploybot/integration"
          title_prefix = "DeployBot integration"
          EOF

      - name: Run action (installs deploybot and runs react)
        id: action
        uses: .
        with:
          config: .mergequeue.toml
          follow: "false"
          dispatch_ci: "false"
          timeout: "30"
        continue-on-error: true

      - name: Assert deploybot CLI is installed
        run: |
          if ! command -v deploybot > /dev/null 2>&1; then
            echo "FAIL: deploybot command not found after install"
            exit 1
          fi
          echo "PASS: deploybot is installed"

      - name: Assert mergeq alias is installed
        run: |
          if ! command -v mergeq > /dev/null 2>&1; then
            echo "FAIL: mergeq alias not found after install"
            exit 1
          fi
          echo "PASS: mergeq alias is installed"

      - name: Assert deploybot shows help
        run: |
          if ! deploybot --help > /dev/null 2>&1; then
            echo "FAIL: deploybot --help failed"
            exit 1
          fi
          echo "PASS: deploybot --help works"
