name: Test missing config file - action should fail gracefully
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Ensure no config file exists
      - name: Remove any existing config file
        run: rm -f .mergequeue.toml

      # Run the action with a missing config file - it should fail
      - id: action
        uses: .
        with:
          config: .mergequeue.toml
          follow: "false"
          dispatch_ci: "false"
          timeout: "5"
        continue-on-error: true

      # The action should have failed (outcome = failure) because config is missing
      - name: Assert action failed due to missing config
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "actual outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with missing config, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when config file is missing"

      # Verify the package was still installed (Python setup ran before the failure)
      - name: Assert deploybot package was installed despite config failure
        run: |
          if ! python -m pip show deploybot-merge-queue > /dev/null 2>&1; then
            echo "FAIL: deploybot-merge-queue package is not installed"
            exit 1
          fi
          echo "PASS: deploybot-merge-queue package was installed"
