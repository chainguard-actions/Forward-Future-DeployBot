name: Test missing config file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Ensure no default config file exists
        run: |
          rm -f .mergequeue.toml
          echo "Confirmed: .mergequeue.toml does not exist"
      - id: action
        uses: .
        continue-on-error: true
        with:
          config: .mergequeue.toml
          follow: "false"
          dispatch_ci: "false"
          timeout: "30"
      - name: Assert action failed due to missing config
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when config is missing, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when config file was missing"
