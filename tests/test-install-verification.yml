name: Test deploybot package installation via action
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a valid mergequeue config
        run: |
          cat > .mergequeue.toml << 'EOF'
          [queue]
          base_branch = "main"
          queue_label = "merge-queue"
          blocked_label = "merge-queue-blocked"
          merge_method = "merge"
          required_checks = ["CI"]
          dependency_directive = "Merge-queue-depends-on"
          trusted_actors = ["@repository-owner"]
          coordinator_actors = ["@repository-owner", "github-actions[bot]"]

          [files]
          generated_paths = []
          generated_version_paths = []
          asset_version_pattern = '\?v=[0-9a-f]{12}'

          [review]

          [pipeline]
          intent_label = "deploy-requested"
          pause_label = "deploybot-paused"
          registry_label = "deploybot-registry"
          registry_title = "DeployBot delivery registry"
          thread_active_hours = 72
          ci_workflows = ["CI"]
          deploy_workflows = ["Deploy"]
          batch_settle_seconds = 15
          ci_failure_grace_seconds = 90
          promotion_workers = 4
          repair_hold_minutes = 60
          hold_merges_while_releasing = true
          repair_branch_prefix = "deploybot/repair"
          ready_to_merge_target_minutes = 15
          merge_to_live_target_minutes = 10
          auto_promote = true
          intent_scope = "head"
          pause_on_failure = true

          [integration]
          mode = "manual"
          branch_prefix = "deploybot/integration"
          title_prefix = "DeployBot integration"
          max_batch_size = 3
          require_non_actions_author = false
          EOF
          echo "Config file created"
      - id: action
        uses: .
        continue-on-error: true
        with:
          config: .mergequeue.toml
          follow: "false"
          dispatch_ci: "false"
          timeout: "30"
      - name: Assert deploybot CLI was installed by the action
        run: |
          echo "Checking deploybot is on PATH after action ran..."
          if ! which deploybot > /dev/null 2>&1; then
            echo "FAIL: deploybot not found on PATH after action ran"
            exit 1
          fi
          echo "deploybot found at: $(which deploybot)"
          echo "PASS: deploybot CLI was installed by the action"
      - name: Assert mergeq alias was also installed
        run: |
          if ! which mergeq > /dev/null 2>&1; then
            echo "FAIL: mergeq alias not found on PATH after action ran"
            exit 1
          fi
          echo "mergeq found at: $(which mergeq)"
          echo "PASS: mergeq alias was installed by the action"
      - name: Assert deploybot react subcommand is available
        run: |
          deploybot react --help
          echo "PASS: deploybot react --help succeeded"
